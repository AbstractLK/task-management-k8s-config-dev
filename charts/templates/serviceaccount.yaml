# Creates the eso-service-account and annotates it with the IAM Role ARN generated by Terraform

apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-service-account
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: "{{ .Values.eso.iamRoleArn }}"
    argocd.argoproj.io/sync-wave: "1"